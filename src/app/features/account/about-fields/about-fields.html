  [maxLength]="bioMax" hint="Da quanto balli, dove ti trovano, cosa ti piace." [error]="'Al massimo ' + bioMax + ' caratteri.'">

    [maxLength]="bioMax" placeholder="Ballo salsa dal 2019, il sabato mi trovi in pista…"
    [formControl]="form.controls.bio"></textarea>
</app-request-field>
