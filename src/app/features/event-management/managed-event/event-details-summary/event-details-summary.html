<!-- SerataModifica.dc.html, "Dettagli": one row per block of the form, to read. -->
<dl class="flex flex-col rounded-[1.125rem] border border-line bg-(--ev-raised)">
  @for (row of rows(); track row.label) {
  <div class="flex min-h-16 flex-col justify-center gap-0.5 border-t border-bone/10 px-3.5 py-2.5 first:border-t-0">
    <dt class="text-xs font-bold text-muted">{{ row.label }}</dt>
    <dd class="text-[0.9375rem] leading-[1.3] font-semibold">{{ row.value }}</dd>
    @if (row.note; as note) {
    <dd class="text-xs text-mint">{{ note }}</dd>
    }
  </div>
  }
</dl>
