<app-navbar />

<main class="mx-auto max-w-4xl px-6 py-10">
  <h1 class="font-display text-2xl font-bold">Organizzatori in attesa di verifica</h1>

  @if (loading()) {
    <p class="mt-6 text-lead">Caricamento…</p>
  } @else if (organizers().length === 0) {
    <p class="mt-6 text-lead">Nessun organizzatore in attesa.</p>
  } @else {
    <ul class="mt-6 flex flex-col gap-3">
      @for (org of organizers(); track org.id) {
        <li class="flex items-center justify-between rounded-xl border border-line p-4">
          <div>
            <p class="font-semibold">{{ org.name }}</p>
            <p class="text-sm text-lead">{{ org.type }} · {{ org.contactEmail }}</p>
          </div>
          <button
            type="button"
            [disabled]="verifyingId() === org.id"
            (click)="verify(org.id)"
            class="rounded-full bg-rose px-4 py-2 text-sm font-semibold text-ink disabled:opacity-50"
          >
            Verifica
          </button>
        </li>
      }
    </ul>
  }
</main>
