<!-- The sidebar renders nothing on screen on mobile until its sheet is
    opened, so this small bar keeps the logo visible at all times below
    md: trigger on the left to open the drawer, logo centered, account
    entry point on the right. -->
<header class="mobile-bar md:hidden">
  <div class="relative flex h-full items-center justify-between px-3">
    <button hlmSidebarTrigger type="button" class="shrink-0" srOnlyText="Apri il menu"></button>

    <a routerLink="/" aria-label="ballastasera — home"
      class="absolute left-1/2 flex -translate-x-1/2 items-center gap-1 no-underline">
      <svg viewBox="0 0 200 210" aria-hidden="true" class="w-6 shrink-0 drop-shadow-[0_6px_14px_rgba(255,77,109,0.45)]">
        <path d="M100,182 C78,140 48,116 48,80 A52 52 0 1 1 152,80 C152,116 122,140 100,182 Z"
          fill="var(--color-rose)" />
        <g fill="var(--color-ink)">
          <rect x="74" y="66" width="13" height="30" rx="6.5" />
          <rect x="93" y="54" width="13" height="54" rx="6.5" />
          <rect x="112" y="62" width="13" height="38" rx="6.5" />
        </g>
      </svg>
      <span class="font-display text-[0.95rem] font-bold tracking-[-0.02em] whitespace-nowrap">balla<span
          class="night text-rose">stasera</span></span>
    </a>

    <div class="flex shrink-0 items-center gap-2">
      @if (isAuthenticated()) {
      <button type="button" (click)="toggleSidebar()" class="account-trigger shrink-0"
        [attr.aria-label]="'Account di ' + currentUser()?.displayName">
        @if (currentUser()?.avatarUrl) {
        <img [src]="currentUser()!.avatarUrl" [alt]="currentUser()!.displayName" referrerpolicy="no-referrer"
          class="avatar-img size-7 shrink-0 rounded-full object-cover" />
        } @else {
        <span
          class="avatar-fallback flex size-7 shrink-0 items-center justify-center rounded-full text-[0.75rem] font-semibold">
          {{ initial() }}
        </span>
        }
      </button>
      } @else {
      <button type="button" (click)="openAuth('login')" class="login-trigger shrink-0" aria-label="Accedi">
        <svg viewBox="0 0 24 24" class="size-4.5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" />
          <circle cx="12" cy="7.5" r="3.75" />
        </svg>
      </button>
      }
    </div>
  </div>
</header>

<hlm-sidebar side="left" collapsible="icon">
  <!-- No brand mark here for now — on desktop the logo (and the WIP badge)
      live pinned in the page itself, next to the language switcher (see
      landing.html); the sidebar rail is nav-only. Mobile still gets both
      from the top bar above. -->
  <div hlmSidebarHeader>
    <button hlmSidebarTrigger type="button" srOnlyText="Comprimi/espandi il menu"></button>
  </div>

  <div hlmSidebarContent>
    <ul hlmSidebarMenu>
      @if (mapEnabled()) {
      <li hlmSidebarMenuItem>
        <a hlmSidebarMenuButton routerLink="/menu" tooltip="Menu">
          <svg viewBox="0 0 24 24" class="size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 20l-5.5-2V4L9 6m0 14l6-2m-6 2V6m6 12l5.5 2V6L15 4m0 14V4m0 0L9 6" />
          </svg>
          <span>Menu</span>
        </a>
      </li>
      }

      <li *appRole="'ADMIN'" hlmSidebarMenuItem>
        <a hlmSidebarMenuButton routerLink="/admin" tooltip="Admin">
          <svg viewBox="0 0 24 24" class="size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3l8 4v5c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V7l8-4z" />
          </svg>
          <span>Admin</span>
        </a>
      </li>
    </ul>
  </div>

  <div hlmSidebarFooter>
    @if (isAuthenticated()) {
    <div
      class="user-id flex items-center gap-2.5 overflow-hidden rounded-md p-2 group-data-[collapsible=icon]:size-8 group-data-[collapsible=icon]:p-2">
      @if (currentUser()?.avatarUrl) {
      <img [src]="currentUser()!.avatarUrl" [alt]="currentUser()!.displayName" referrerpolicy="no-referrer"
        class="avatar-img size-7 shrink-0 rounded-full object-cover" />
      } @else {
      <span
        class="avatar-fallback flex size-7 shrink-0 items-center justify-center rounded-full text-[0.75rem] font-semibold">
        {{ initial() }}
      </span>
      }
      <span class="truncate text-[0.82rem] font-semibold text-bone group-data-[collapsible=icon]:hidden">{{
        currentUser()?.displayName }}</span>
    </div>

    <ul hlmSidebarMenu>
      <li hlmSidebarMenuItem>
        <button hlmSidebarMenuButton type="button" (click)="logout()" tooltip="Esci" class="logout-item">
          <svg viewBox="0 0 24 24" class="size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 4H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8M10 12h11m0 0l-3.5-3.5M21 12l-3.5 3.5" />
          </svg>
          <span>Esci</span>
        </button>
      </li>
    </ul>
    } @else {
    <ul hlmSidebarMenu>
      <li hlmSidebarMenuItem>
        <button hlmSidebarMenuButton type="button" (click)="openAuth('login')" tooltip="Accedi">
          <svg viewBox="0 0 24 24" class="size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" />
            <circle cx="12" cy="7.5" r="3.75" />
          </svg>
          <span>Accedi</span>
        </button>
      </li>
    </ul>
    }
  </div>
</hlm-sidebar>

<app-auth-modal [(open)]="authOpen" [mode]="authMode()" />
