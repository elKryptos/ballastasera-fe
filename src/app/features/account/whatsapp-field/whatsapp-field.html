<app-request-field label="WhatsApp" fieldId="account-whatsapp" [control]="form.controls.whatsapp" [optional]="true"
  [hint]="hint()" error="Controlla il numero: sembra incompleto.">
  <input id="account-whatsapp" class="request-input" type="tel" inputmode="tel" autocomplete="tel"
    placeholder="333 123 4567" [formControl]="form.controls.whatsapp" />
</app-request-field>

<div class="switch-row">
  <div class="min-w-0 grow">
    <p id="account-whatsapp-visible-label" class="text-[0.9375rem] font-bold">Mostra il mio WhatsApp</p>
    <p class="mt-1 text-[0.8125rem] leading-snug text-(--ev-soft)">
      @if (visible()) {
      Chi apre il tuo profilo può scriverti.
      } @else {
      Non lo vede nessuno: resta salvato solo per te.
      }
    </p>
  </div>
  <app-toggle-switch labelledBy="account-whatsapp-visible-label" [checked]="visible()" (toggled)="toggleVisible()" />
</div>
