<div class="deck" [class.is-live]="live()">
  <!-- The record: grooves and label spin, the light on them stays put —
      what makes it read as a real one turning, not a picture rotating. -->
  <button type="button" class="record" (click)="toggle()" [attr.aria-pressed]="live()"
    [attr.aria-label]="live() ? 'Ferma il disco' : 'Metti su il disco: ' + (dance() === 'salsa' ? 'lato A, salsa' : 'lato B, bachata')">
    <span class="vinyl" aria-hidden="true">
      <span class="spinner">
        <svg class="label" [class.pulse-a]="live() && beat() % 2 === 0" [class.pulse-b]="live() && beat() % 2 === 1"
          viewBox="0 0 200 200">
          <defs>
            <path id="lesson-label-ring" d="M100 100m-70 0a70 70 0 1 1 140 0a70 70 0 1 1-140 0" />
          </defs>
          <path d="M100 0a100 100 0 0 0 0 200Z" fill="var(--fuego-lit)" />
          <path d="M100 0a100 100 0 0 1 0 200Z" fill="var(--flamingo-lit)" />
          <circle cx="100" cy="100" r="86" fill="none" stroke="var(--night)" stroke-opacity=".35" />
          <!-- Stretched to the ring exactly (2π·70 ≈ 440), whatever the font. -->
          <text class="label-ring">
            <textPath href="#lesson-label-ring" textLength="432" lengthAdjust="spacing">
              SALSA · BACHATA · LEZIONE N°1 · BALLASTASERA ·
            </textPath>
          </text>
          <text class="label-big" x="100" y="78" text-anchor="middle">1·2·3</text>
          <text class="label-small" x="100" y="136" text-anchor="middle">33⅓ GIRI</text>
        </svg>
      </span>
    </span>
    <span class="shine" aria-hidden="true"></span>
    <span class="spindle" aria-hidden="true"></span>
    <span class="cue" aria-hidden="true">
      @if (live()) {
      <svg viewBox="0 0 24 24" fill="currentColor">
        <rect x="6" y="5" width="4" height="14" rx="1.4" />
        <rect x="14" y="5" width="4" height="14" rx="1.4" />
      </svg>
      } @else {
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M8 4.8v14.4a1 1 0 0 0 1.5.86l11.6-7.2a1 1 0 0 0 0-1.72L9.5 3.94A1 1 0 0 0 8 4.8Z" />
      </svg>
      }
    </span>
  </button>

  <!-- Parked off the record until it plays, then swung onto the groove. -->
  <svg class="arm" viewBox="0 0 120 300" aria-hidden="true">
    <circle cx="86" cy="34" r="26" class="arm-base" />
    <circle cx="86" cy="34" r="11" class="arm-pivot" />
    <path d="M86 34v150c0 26-12 44-34 66" class="arm-rod" />
    <rect x="34" y="240" width="26" height="40" rx="5" transform="rotate(42 47 260)" class="arm-head" />
  </svg>

  @for (n of [0, 1, 2]; track n) {
  <svg class="note note--{{ n }}" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M9 18.5a3 3 0 1 1-2-2.83V5l12-2.5v12.6a3 3 0 1 1-2-2.83V6.9l-8 1.7Z" />
  </svg>
  }

  <div class="sides" role="group" aria-label="Lato del disco">
    <button type="button" [attr.aria-pressed]="dance() === 'salsa'" (click)="pick('salsa')">
      <b>A</b>Salsa
    </button>
    <button type="button" [attr.aria-pressed]="dance() === 'bachata'" (click)="pick('bachata')">
      <b>B</b>Bachata
    </button>
  </div>
</div>
