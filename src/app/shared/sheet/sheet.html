<dialog #dialog class="ev-dialog" closedby="any" [attr.aria-labelledby]="titleId" (close)="open.set(false)"
  (cancel)="onCancel($event)" (pointerdown)="pointerDown($event)" (pointerup)="pointerUp($event)">
  <header class="header">
    <span class="grabber md:hidden" aria-hidden="true"></span>
    <div class="heading">
      <h2 [id]="titleId" class="title">{{ title() }}</h2>
      @if (subtitle(); as subtitle) {
      <p class="subtitle">{{ subtitle }}</p>
      }
    </div>
    <button type="button" class="close" aria-label="Chiudi" [disabled]="busy()" (click)="close()">
      <svg viewBox="0 0 24 24" class="size-4.5" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
  </header>
  <div class="body">
    <ng-content />
  </div>
  <ng-content select="[sheetFooter]" />
</dialog>
