@if (appearance() === 'chips') {
<!-- AdminSerate.dc.html: "Filtra per stato". The form's chips (choice-group): h-11, rounded-xl,
  sky blue when picked. -->
<div role="group" aria-label="Filtra per stato" class="flex gap-1.5 overflow-x-auto ev-scroll-row">
  @for (item of tabs(); track item.tab) {
  @let selected = tab() === item.tab;
  <button type="button" [attr.aria-pressed]="selected" (click)="tabChange.emit(item.tab)"
    class="flex h-11 shrink-0 cursor-pointer items-center gap-1.5 rounded-xl border px-3.5 text-sm font-bold"
    [class]="selected ? 'border-(--ev-pick) bg-(--ev-pick) text-(--ev-on-pick)' : 'border-line bg-(--ev-raised) text-lead'">
    {{ item.label }}
    @let count = counts()[item.tab];
    @if (count !== undefined) {
    <span class="font-mono text-xs opacity-80">{{ count }}</span>
    }
  </button>
  }
</div>
} @else {
<!-- SeratePubblicate.dc.html: "Serate". -->
<div role="tablist" aria-label="Serate" class="grid grid-cols-3 gap-1 rounded-[0.875rem] bg-(--ev-raised) p-1">
  @for (item of tabs(); track item.tab) {
  @let selected = tab() === item.tab;
  <button type="button" role="tab" [attr.aria-selected]="selected" (click)="tabChange.emit(item.tab)"
    class="h-10 cursor-pointer rounded-[0.625rem] text-[0.8125rem] font-bold"
    [class]="selected ? 'bg-(--ev-pick) text-(--ev-on-pick)' : 'text-lead'">
    {{ item.label }}
    @let count = counts()[item.tab];
    @if (count !== undefined) {
    · {{ count }}
    }
  </button>
  }
</div>
}
