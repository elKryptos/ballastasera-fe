@if (visible()) {
<div class="flex flex-col gap-2.5">
  <p class="text-sm leading-snug text-(--ev-soft)">
    <span class="font-bold text-(--ev-text)">È la tua pagina?</span>
    Rivendica {{ name() }} e pubblica tu le tue serate.
  </p>
  <button type="button" (click)="claim()"
    class="flex h-11 items-center justify-center gap-2 rounded-[0.875rem] border border-rose-lit/50 px-4 text-sm font-extrabold text-(--ev-like)">
    <ng-icon name="lucideBadgeCheck" class="size-4.5" />
    Rivendica la pagina
  </button>
</div>
<app-auth-modal [(open)]="authOpen" [text]="authText()" [returnUrl]="claimUrl()" />
}
