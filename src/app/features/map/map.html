<app-navbar />
<app-auth-modal [(open)]="authOpen" />

<main appSidebarPush class="relative h-screen pt-(--header-h) md:pt-0">
  <div class="relative h-full w-full">
    <app-map-filters [cities]="cities()" [danceStyles]="danceStyles()" [selectedCityId]="selectedCityId()"
      [selectedStyleNames]="selectedStyleNames()" [loading]="loading()" [error]="error()"
      [eventCount]="filteredEvents().length" [open]="filtersOpen()" [hideForCard]="hideFabsForCard()"
      [isDesktop]="isDesktop()" (citySelected)="selectCity($event)" (styleToggled)="selectStyle($event)"
      (openToggled)="toggleFilters()" />

    <div class="relative h-full w-full">
      <!-- isolate: Leaflet's own panes (tiles/markers/popups) carry z-index
          up to 700, which would otherwise leak out and out-stack the
          filters, legend and event card over it (all z-map-content:10). -->
      <div #mapContainer class="absolute inset-0 isolate"></div>

      <!-- Legend: small enough to stay inline. Same themed glass as the filters
          and event card — the --map-* tokens in map.css. -->
      <button type="button"
        class="absolute bottom-4 left-4 z-map-content inline-flex size-10 origin-bottom-left items-center justify-center rounded-full border border-(--map-glass-border) bg-(--map-glass) text-(--map-text) shadow-(--map-shadow) backdrop-blur-[20px] backdrop-saturate-140 transition-all duration-200 ease-out"
        [class.scale-50]="legendOpen() || hideFabsForCard()" [class.opacity-0]="legendOpen() || hideFabsForCard()"
        [class.pointer-events-none]="legendOpen() || hideFabsForCard()" [class.cursor-pointer]="!legendOpen()"
        [attr.inert]="legendOpen() || hideFabsForCard() ? '' : null" (click)="toggleLegend()" aria-label="Legenda">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 8v.01M11 11h1v5h1" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      <section
        class="absolute bottom-4 left-4 z-map-content w-30 origin-bottom-left overflow-hidden rounded-lg border border-(--map-glass-border) bg-(--map-glass) p-3 text-(--map-text) shadow-(--map-shadow) backdrop-blur-[20px] backdrop-saturate-140 transition-all duration-200 ease-out"
        [class.scale-50]="!legendOpen() || hideFabsForCard()" [class.opacity-0]="!legendOpen() || hideFabsForCard()"
        [class.pointer-events-none]="!legendOpen() || hideFabsForCard()" [class.cursor-pointer]="legendOpen()"
        [attr.inert]="!legendOpen() || hideFabsForCard() ? '' : null"
        aria-label="Legenda dei pin, premi per chiudere" (click)="toggleLegend()">
        <ul class="flex flex-col gap-2">
          @for (item of legendItems; track item.type; let i = $index) {
          <li class="flex items-center gap-2 text-sm">
            <svg [class.legend-icon]="legendOpen()" viewBox="0 0 24 32" width="16" height="22"
              [style.color]="item.color" [style.animation-delay.ms]="i * 40">
              <path [attr.d]="item.shape" fill="currentColor" />
              <path [attr.d]="item.glyph" fill="#fff" />
            </svg>
            {{ item.label }}
          </li>
          }
        </ul>
      </section>

      @if (selectedEvent(); as event) {
      <app-event-map-card [event]="event" [now]="now()"
        [going]="engagement.isGoing(event.id)" [liked]="engagement.isLiked(event.id)"
        (closed)="closeDetail()" (goingToggled)="toggleGoing(event)" (likeToggled)="toggleLike(event)" />
      }
    </div>
  </div>
</main>
