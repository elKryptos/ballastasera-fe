<!-- The sidebar renders nothing on screen on mobile until its sheet is
    opened, so this small bar keeps the logo visible at all times below
    md: trigger on the left to open the drawer, logo centered, a login
    button or a read-only account avatar on the right. -->
<header class="mobile-bar md:hidden">
  <div class="relative flex h-full items-center justify-between px-3">
    <button hlmSidebarTrigger type="button" class="shrink-0"
      [srOnlyText]="openMobile() ? 'Chiudi il menu' : 'Apri il menu'"></button>

    <a routerLink="/" aria-label="ballastasera — home"
      class="absolute left-1/2 flex -translate-x-1/2 items-center gap-1 no-underline">
      <svg viewBox="0 0 200 210" aria-hidden="true" class="w-6 shrink-0 drop-shadow-[0_6px_14px_rgba(255,77,109,0.45)]">
        <path d="M100,182 C78,140 48,116 48,80 A52 52 0 1 1 152,80 C152,116 122,140 100,182 Z"
          fill="var(--color-rose)" />
        <g fill="var(--color-ink)">
          <rect x="74" y="66" width="13" height="30" rx="6.5" />
          <rect x="93" y="54" width="13" height="54" rx="6.5" />
          <rect x="112" y="62" width="13" height="38" rx="6.5" />
        </g>
      </svg>
      <span class="font-display text-[0.95rem] font-bold tracking-[-0.02em] whitespace-nowrap">balla<span
          class="night text-rose">stasera</span></span>
    </a>

    <div class="flex shrink-0 items-center gap-2">
      @if (isAuthenticated()) {
      <!-- Status indicator only, not a control: opening the sidebar is the
          hamburger trigger's job alone, so this doesn't duplicate it. -->
      <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full outline-offset-2" aria-hidden="true">
        @if (currentUser()?.avatarUrl) {
        <img [src]="currentUser()!.avatarUrl" [alt]="currentUser()!.displayName" referrerpolicy="no-referrer"
          class="avatar-img size-8 shrink-0 rounded-full object-cover" />
        } @else {
        <span
          class="avatar-fallback flex size-8 shrink-0 items-center justify-center rounded-full text-[0.85rem] font-semibold">
          {{ initial() }}
        </span>
        }
      </span>
      } @else {
      <button type="button" (click)="openAuth('login')" aria-label="Accedi"
        class="flex h-8 w-8 shrink-0 cursor-pointer items-center justify-center rounded-full border-[1.5px] border-line p-0 text-bone outline-offset-2 active:border-rose active:bg-rose/12">
        <svg viewBox="0 0 24 24" class="size-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" />
          <circle cx="12" cy="7.5" r="3.75" />
        </svg>
      </button>
      }
    </div>
  </div>
</header>

<hlm-sidebar side="left" collapsible="icon">
  <!-- Desktop only (this whole block is skipped on mobile, which has its own
      trigger + centred logo in the top bar above): the collapse/expand
      trigger, plus the brand mark beside it once the rail is wide enough to
      show it — the collapsed icon rail (3rem) is already fully spent on the
      trigger button itself, padding included, so the mark only appears once
      expanded. -->
  @if (!isMobile()) {
  <div hlmSidebarHeader>
    <div class="flex items-center gap-2">
      <button hlmSidebarTrigger type="button" srOnlyText="Comprimi/espandi il menu"></button>
      <a routerLink="/" aria-label="ballastasera — home"
        class="hidden shrink-0 items-center gap-1.5 overflow-hidden no-underline group-data-[state=expanded]:flex">
        <svg viewBox="0 0 200 210" aria-hidden="true" class="w-5 shrink-0 drop-shadow-[0_6px_14px_rgba(255,77,109,0.45)]">
          <path d="M100,182 C78,140 48,116 48,80 A52 52 0 1 1 152,80 C152,116 122,140 100,182 Z" fill="var(--color-rose)" />
          <g fill="var(--color-ink)">
            <rect x="74" y="66" width="13" height="30" rx="6.5" />
            <rect x="93" y="54" width="13" height="54" rx="6.5" />
            <rect x="112" y="62" width="13" height="38" rx="6.5" />
          </g>
        </svg>
        <span class="font-display text-[0.95rem] font-bold tracking-[-0.02em] whitespace-nowrap">balla<span
            class="night text-rose">stasera</span></span>
      </a>
    </div>
  </div>
  }

  <div hlmSidebarContent class="px-3 pt-4 pb-3 md:p-1.5">
    <ul hlmSidebarMenu>
      @if (mapEnabled()) {
      <li hlmSidebarMenuItem>
        <!-- Logged out: the map works without a session now, so it's the
        direct entry point (/mappa). Logged in: back to the hub (/menu),
        same as before — the map is one tap away from there anyway. -->
        <a hlmSidebarMenuButton [routerLink]="isAuthenticated() ? '/menu' : '/mappa'"
          [tooltip]="isAuthenticated() ? 'Menu' : 'Mappa'"
          class="nav-item--menu h-auto! min-h-11! gap-[0.7rem]! rounded-lg! text-[1rem]!">
          <svg viewBox="0 0 24 24" class="size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 20l-5.5-2V4L9 6m0 14l6-2m-6 2V6m6 12l5.5 2V6L15 4m0 14V4m0 0L9 6" />
          </svg>
          <span>{{ isAuthenticated() ? 'Menu' : 'Mappa' }}</span>
        </a>
      </li>
      }

      <li *appRole="'ORGANIZER'" hlmSidebarMenuItem>
        <a hlmSidebarMenuButton routerLink="/organizer/events/new" tooltip="Crea evento">
          <svg viewBox="0 0 24 24" class="size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span>Crea evento</span>
        </a>
      </li>

      <li *appRole="'ADMIN'" hlmSidebarMenuItem>
        <a hlmSidebarMenuButton routerLink="/admin" tooltip="Admin"
          class="nav-item--admin h-auto! min-h-11! gap-[0.7rem]! rounded-lg! text-[1rem]!">
          <svg viewBox="0 0 24 24" class="size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3l8 4v5c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V7l8-4z" />
          </svg>
          <span>Admin</span>
        </a>
      </li>
    </ul>
  </div>

  <div hlmSidebarFooter class="px-3 pb-3 md:p-2">
    @if (isAuthenticated()) {
    <ul hlmSidebarMenu>
      <li hlmSidebarMenuItem>
        <button hlmSidebarMenuButton type="button" tabindex="-1"
          class="user-id nav-item--user h-auto! min-h-11! gap-[0.7rem]! rounded-lg! text-[1rem]!"
          [tooltip]="currentUser()?.displayName ?? ''">
          @if (currentUser()?.avatarUrl) {
          <!-- Same size-6 in both collapsed and expanded states on purpose
          (see the [data-collapsible='icon'] [hlmSidebarMenuButton] override
          in styles.css, which grew the collapsed button's own content box to
          fit this) — a size that changes between states is what made
          expanding the rail look like a resize glitch instead of a clean
          reveal. -->
          <img [src]="currentUser()!.avatarUrl" [alt]="currentUser()!.displayName" referrerpolicy="no-referrer"
            class="avatar-img size-6 shrink-0 rounded-full object-cover" />
          } @else {
          <span
            class="avatar-fallback flex size-6 shrink-0 items-center justify-center rounded-full text-[0.7rem] font-semibold">
            {{ initial() }}
          </span>
          }
          <span>{{ currentUser()?.displayName }}</span>
        </button>
      </li>
      <li hlmSidebarMenuItem>
        <button hlmSidebarMenuButton type="button" (click)="logout()" tooltip="Esci"
          class="nav-item--logout logout-item h-auto! min-h-11! gap-[0.7rem]! rounded-lg! text-[1rem]! text-lead">
          <svg viewBox="0 0 24 24" class="size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 4H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8M10 12h11m0 0l-3.5-3.5M21 12l-3.5 3.5" />
          </svg>
          <span>Esci</span>
        </button>
      </li>
    </ul>
    } @else {
    <ul hlmSidebarMenu>
      <li hlmSidebarMenuItem>
        <button hlmSidebarMenuButton type="button" (click)="openAuth('login')" tooltip="Accedi"
          class="nav-item--login h-auto! min-h-11! gap-[0.7rem]! rounded-lg! text-[1rem]!">
          <svg viewBox="0 0 24 24" class="size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" />
            <circle cx="12" cy="7.5" r="3.75" />
          </svg>
          <span>Accedi</span>
        </button>
      </li>
    </ul>
    }
  </div>
</hlm-sidebar>

<app-auth-modal [(open)]="authOpen" [mode]="authMode()" />
