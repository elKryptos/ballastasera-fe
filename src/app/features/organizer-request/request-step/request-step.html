<!-- From the Claude Design canvas "Diventa organizzatore". As tall as the screen,
    so the button stays at the bottom on a short step and follows the scroll on
    a long one. -->
<div class="mx-auto flex min-h-[calc(100dvh-var(--header-h))] w-full max-w-xl flex-col px-4 pt-1 md:min-h-dvh">
  @if (inPlaceBackLabel(); as label) {
  <button type="button" class="-ml-1 flex h-11 items-center gap-1 self-start text-sm font-semibold text-(--ev-soft)"
    (click)="inPlaceBackClicked.emit()">
    <ng-icon name="lucideChevronLeft" size="1.125rem" aria-hidden="true" />
    {{ label }}
  </button>
  } @else {
  <a [routerLink]="back().url" class="-ml-1 flex h-11 items-center gap-1 self-start text-sm font-semibold text-(--ev-soft)">
    <ng-icon name="lucideChevronLeft" size="1.125rem" aria-hidden="true" />
    {{ back().label }}
  </a>
  }

  <div class="mt-1 flex gap-1.5" aria-hidden="true">
    @for (done of bars(); track $index) {
    <span class="h-1 flex-1 rounded-sm" [class]="done ? 'bg-rose' : 'bg-(--ev-edge)'"></span>
    }
  </div>

  <p class="mt-4 text-[0.8125rem] font-bold text-rose">Passo {{ stepNumber() }} di {{ stepCount() }}</p>
  <h1 class="mt-1 font-display text-3xl leading-[1.1] font-extrabold tracking-[-0.02em]">{{ heading() }}</h1>
  @if (lead(); as lead) {
  <p class="mt-2 text-[0.9375rem] leading-[1.45] text-(--ev-soft)">{{ lead }}</p>
  }

  <div class="mt-5 grow">
    <ng-content />
  </div>

  <div class="sticky bottom-0 mt-4 bg-linear-to-t from-ground from-70% to-transparent pt-6 pb-6">
    <button type="button"
      class="flex h-13 w-full items-center justify-center gap-2 rounded-2xl bg-rose text-base font-extrabold text-(--ev-on-rose) disabled:opacity-45"
      [disabled]="ctaDisabled()" (click)="ctaClicked.emit()">
      {{ ctaLabel() }}
      <ng-icon [name]="ctaIcon()" size="1.125rem" aria-hidden="true" />
    </button>
  </div>
</div>
